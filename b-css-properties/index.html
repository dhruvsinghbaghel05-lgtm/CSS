<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS PROPERTIES</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Basic CSS Properties</h1>
    <!-- <p>This is a paragraph with some basic CSS properties applied to it.</p> -->

     <h2>Selectors :</h2>
     <ol>
        <li>Universal Selector : *{}</li>
        <li>Element Selector : nameofelement{}</li>
        <li>Class Selector : .classname{}</li>
        <li>ID Selector : #idname{}</li>
     </ol>

      <h2>Color Systems :</h2>
    <ol>
        <li id="color"><strong>Color:</strong> The text color of the element.</li>
        <li id="background"><strong>Background-color:</strong> The background color of the element.</li>
    </ol>

</body>
</html>

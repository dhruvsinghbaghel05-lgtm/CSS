<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
</head>
<body>
    <h2>Hover Transitions</h2>
    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>
    <h2>Dropping Property</h2>
    <div id="box3">Box 3</div>
    <h2>Transform Property</h2>

    <h4>1. ROTATE : Used to rotate an element around its center</h4><BR>
    <div id="box4">Box 4</div>

    <h4>2. SCALE : Used to increase or decrease the size of an element</h4><BR>
    <div id="box5">Box 5</div>

    <h4>3. TRANSLATE : Used to move the element along x and y axes</h4><BR>
    <div id="box6">Box 6</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Flexbox</h2>
    <p>It is a one dimensional layout method for arranging elements in rows and columns.</p>
    <h4>Flexbox properties</h4>
    <ol>
        <li>flex-direction</li>
        <li>flex-wrap</li>
        <li>flex-flow</li>
        <li>justify-content</li>
        <li>align-items</li>
        <li>align-content</li>
    </ol>

    <h2>Flexbox playground</h2>
    <div id="container">
        <div style="background-color: violet;">Violet</div>
        <div style="background-color:indigo ;">Indigo</div>
        <div style="background-color: blue;">Blue</div>
        <div style="background-color: green;">Green</div>
        <div style="background-color: yellow;">Yellow</div>
        <div style="background-color: orange;">Orange</div>
        <div style="background-color: red;">Red</div>
    </div>

</body>
</html>
